[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fopost"
version = "0.2.0"
description = "Official Python SDK for the FoPost API. Schedule and publish to +30 social platforms from your code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "FoPost, Porter Bridge, LLC" }]
keywords = [
  "fopost",
  "social-media",
  "publishing",
  "scheduling",
  "twitter",
  "linkedin",
  "instagram",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.urls]
Homepage = "https://fopost.com"
Documentation = "https://fopost.com/docs"
Repository = "https://github.com/fopost/fopost-python"
Issues = "https://github.com/fopost/fopost-python/issues"
Support = "https://fopost.com/contact"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/fopost"]

[tool.hatch.build.targets.sdist]
include = ["src/fopost", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fopost", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/fopost"]
